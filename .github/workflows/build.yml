name: Build MacChanger EXE

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore MacChanger/MacChanger.csproj

      - name: Publish (self-contained single exe)
        run: >
          dotnet publish MacChanger/MacChanger.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: MacChanger-exe
          path: publish/MacChanger.exe
